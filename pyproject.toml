[project]
name = "sol-lane"
version = "0.1.0"
description = "Sol Pro review lane: pack, deliver, harvest — from one CLI."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lane = "lane.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
