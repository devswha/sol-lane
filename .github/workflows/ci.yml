name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.10.9"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Install locked development environment
        run: uv sync --locked --extra dev
      - name: Verify required sandbox runtime
        run: command -v bwrap
      - name: Lint
        run: uv run --locked ruff check .
      - name: Scan source for security issues
        run: uv run --locked bandit --config pyproject.toml --quiet --recursive src -ll
      - name: Audit locked production dependencies
        run: |
          uv export --locked --no-dev --no-editable --no-emit-project --format requirements-txt --output-file requirements.txt
          uv run --locked pip-audit --strict --requirement requirements.txt
      - name: Test with coverage threshold
        run: uv run --locked pytest --cov=lane

  package:
    name: Build and smoke-test wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: "0.10.9"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Build and validate distributions
        run: |
          uv sync --locked --extra dev
          uv build
          uv run --locked twine check dist/*
      - name: Smoke-test installed distributions in isolated environments
        run: |
          uv export --locked --no-dev --no-editable --no-emit-project --format requirements-txt --output-file "${{ runner.temp }}/requirements.txt"
          uv venv --clear "${{ runner.temp }}/lane-wheel-smoke"
          uv pip install --python "${{ runner.temp }}/lane-wheel-smoke/bin/python" --requirement "${{ runner.temp }}/requirements.txt"
          uv pip install --python "${{ runner.temp }}/lane-wheel-smoke/bin/python" --no-deps dist/*.whl
          "${{ runner.temp }}/lane-wheel-smoke/bin/lane" --help
          uv venv --clear "${{ runner.temp }}/lane-sdist-smoke"
          uv pip install --python "${{ runner.temp }}/lane-sdist-smoke/bin/python" --requirement "${{ runner.temp }}/requirements.txt"
          uv pip install --python "${{ runner.temp }}/lane-sdist-smoke/bin/python" --no-deps dist/*.tar.gz
          "${{ runner.temp }}/lane-sdist-smoke/bin/lane" --help
